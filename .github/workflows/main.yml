name: Deploy Orcat to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check codebase
        run: npm run lint

      - name: Run automated test suite
        run: npx tsx --test src/utils/orcatLogic.test.ts

      - name: Build production bundle
        env:
          VITE_COMING_SOON_MODE: ${{ vars.VITE_COMING_SOON_MODE || 'false' }}
          VITE_CONTRACT_ADDRESS: ${{ vars.VITE_CONTRACT_ADDRESS || '' }}
          VITE_TRIBFI_URL: ${{ vars.VITE_TRIBFI_URL || 'https://tribfi.fun' }}
          VITE_ENABLE_SOCIALS: ${{ vars.VITE_ENABLE_SOCIALS || 'true' }}
          VITE_TELEGRAM_URL: ${{ vars.VITE_TELEGRAM_URL || 'https://t.me/orcat_base' }}
          VITE_X_URL: ${{ vars.VITE_X_URL || 'https://x.com/orcat_base' }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
